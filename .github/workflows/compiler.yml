name: Criar Defconfig e Compilar Kernel (Moto G200)

on:
  workflow_dispatch: # Ativação manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v4

    - name: Instalar Dependências de Compilação
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev ccache libssl-dev libgmp-dev libmpfr-dev libmpc-dev texinfo libncurses5-dev unzip bison flex

    - name: Baixar Google Android Clang 12.0.5 via Sparse-Checkout
      run: |
        git clone --depth 1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchain
        cd toolchain
        git sparse-checkout set clang-r416183b
        echo "$(pwd)/clang-r416183b/bin" >> $GITHUB_PATH

    - name: Gerar lahaina_qgki_defconfig e Compilar
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        mkdir -p out
        
        # PASSO 1: Mesclar os fragmentos originais (com as subpastas corretas)
        ARCH=arm64 scripts/kconfig/merge_config.sh -O out \
          arch/arm64/configs/vendor/lahaina_GKI.config \
          arch/arm64/configs/vendor/ext_config/moto-lahaina.config \
          arch/arm64/configs/vendor/ext_config/moto-lahaina-xpeng.config
        
        # PASSO 2: Minimizar e transformar o resultado em um defconfig limpo
        make O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- savedefconfig
        
        # PASSO 3: Copiar o defconfig gerado para a raiz de configs do kernel
        cp out/defconfig arch/arm64/configs/lahaina_qgki_defconfig
        
        # PASSO 4: Limpar a pasta out antiga para garantir uma build 100% limpa
        rm -rf out && mkdir -p out
        
        # PASSO 5: Chamar o Kconfig usando o SEU novo defconfig criado direto na raiz
        make O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- lahaina_qgki_defconfig
        
        # PASSO 6: Compilar o kernel e os módulos
        make -j$(nproc --all) O=out \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu-

    - name: Coletar Kernel, Módulos e o Novo Defconfig
      run: |
        mkdir artifact
        # Salva o seu novo arquivo de configuração unificado para você guardar
        cp arch/arm64/configs/lahaina_qgki_defconfig artifact/
        # Copia o kernel gerado
        cp out/arch/arm64/boot/Image* artifact/ 2>/dev/null || true
        cp out/arch/compilacao/boot/boot.img artifact/ 2>/dev/null || true
        # Copia os módulos .ko do Wi-Fi
        find out/ -name "*.ko" -exec cp {} artifact/ \;

    - name: Enviar Arquivos para Download
      uses: actions/upload-artifact@v4
      with:
        name: Build-Custom-Defconfig-MotoG200
        path: artifact/*
        
